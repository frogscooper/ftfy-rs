[package]
name = "ftfy-rs"
description = "Fixes mojibake and other glitches in Unicode text. A faithful Rust port of Python's ftfy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["unicode", "mojibake", "encoding", "text", "ftfy"]
categories = ["text-processing", "encoding"]

[lib]
name = "ftfy_rs"

[dependencies]
regex = "1"
unicode-normalization = "0.1"
rayon = { version = "1", optional = true }

[dev-dependencies]
rayon = "1"

[features]
default = ["parallel"]
# Fix long texts on all cores, with rayon.
parallel = ["dep:rayon"]
