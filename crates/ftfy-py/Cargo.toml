[package]
name = "ftfy-py"
description = "Python bindings for ftfy-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
ftfy-rs = { path = "../ftfy-rs" }
pyo3 = { version = "0.25", features = ["extension-module"] }
